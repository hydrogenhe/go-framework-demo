<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日志查询 · Go Demo</title>
<style>
:root{--bg:#f5f6f8;--ink:#202938;--muted:#718096;--line:#e5e9ef;--accent:#d97745}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1320px)/2));gap:20px}.brand{font-size:17px;font-weight:750}header a{color:var(--muted);text-decoration:none}main{max-width:1320px;margin:36px auto;padding:0 24px}h1{font-size:28px;letter-spacing:-.03em;margin:0 0 6px}p{margin:0;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:24px;padding:24px}.filters{display:flex;gap:16px;align-items:end;flex-wrap:wrap}label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:650;color:var(--muted)}.keyword{flex:1;min-width:240px}input,select{border:1px solid #d9dfe8;border-radius:8px;height:44px;padding:0 12px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #d9774512}.button{border:0;border-radius:8px;background:var(--accent);color:#fff;height:44px;padding:0 24px;font-weight:650}.subtle{background:#fff;color:var(--ink);border:1px solid var(--line)}.results{padding:0;overflow:hidden}.result-head{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.result-head strong{font-size:16px}.meta{font-size:12px;color:var(--muted)}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:880px;table-layout:fixed}th{font-size:11px;font-weight:650;color:var(--muted);text-align:left;background:#fafbfc;letter-spacing:.04em}th,td{padding:16px 20px;border-bottom:1px solid var(--line);vertical-align:top}th:nth-child(1){width:155px}th:nth-child(2){width:100px}th:nth-child(4){width:145px}th:nth-child(5){width:100px}th:nth-child(6){width:82px}td.message{overflow-wrap:anywhere}td .preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:550}.id{margin-top:5px;font:11px/1.5 ui-monospace,SFMono-Regular,monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{font-variant-numeric:tabular-nums;white-space:nowrap}.time small{display:block;font-size:11px;color:var(--muted)}.badge{display:inline-block;padding:3px 8px;border-radius:5px;background:#edf4ff;color:#3566a7;font-size:10px;font-weight:750;letter-spacing:.03em}.badge.error,.badge.fatal,.badge.panic,.badge.dpanic{background:#fff0ee;color:#b94a3c}.badge.warn{background:#fff7e6;color:#9b6c11}.badge.debug{background:#eff1f5;color:#697386}.detail-toggle{border:0;background:transparent;color:var(--accent);padding:0;font-size:12px;white-space:nowrap}.details td{padding:0;background:#fafbfc}.detail-panel{padding:24px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px 20px}.detail-label{color:var(--muted);font-size:12px}.detail-value{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.75 ui-monospace,SFMono-Regular,monospace;color:#334155}.detail-value.code{padding:16px;border:1px solid var(--line);background:#fff;border-radius:8px}.empty{padding:60px 24px;text-align:center;color:var(--muted)}.pagination{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.pagination button{height:34px;padding:0 14px}.page-actions{display:flex;align-items:center;gap:14px}.notice{padding:12px 16px;margin-top:16px;background:#fff0ee;color:#a53e34;border-radius:8px}.login{max-width:420px;margin:40px auto;padding:28px}.login label{margin:18px 0}.login button{width:100%}[hidden]{display:none!important}@media(max-width:640px){header{padding:0 18px}main{padding:0 16px;margin:24px auto}.card{padding:18px}.results{padding:0}.filters>*{width:100%}.keyword{min-width:0}.filters input,.filters select{width:100%}.detail-panel{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand">Go Demo <span style="color:var(--accent)">/ 日志查询</span></div><a href="index.html">← 返回管理工作台</a></header>
<main><h1>查找日志</h1><p>输入部分 Log ID、请求路径或错误关键词，定位日志记录。</p>
<section id="workspace" hidden>
<form id="query-form" class="card filters"><label class="keyword">查询关键词<input id="keyword" maxlength="128" placeholder="Log ID、/api/orders、库存不足…" autocomplete="off"></label><label>日志日期<input id="date" type="date" title="留空自动查询最新日期"></label><label>日志级别<select id="level"><option value="">全部级别</option><option value="info">INFO</option><option value="err">ERR · 错误</option><option value="warn">WARN</option><option value="debug">DEBUG</option></select></label><button id="search" class="button">查询日志</button><button id="reset" class="button subtle" type="button">重置</button></form>
<p class="meta" style="margin-top:10px">日期留空查询最近一天；ERR 包含 ERROR、FATAL 和 PANIC。</p>
<section class="card results"><div class="result-head"><strong id="count">日志记录</strong><span id="file" class="meta">输入条件后点击查询</span></div><div class="table-scroll"><table id="table" hidden><thead><tr><th>时间</th><th>级别</th><th>日志摘要 / Log ID</th><th>类型</th><th>耗时</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty">查询结果会显示在这里。</div><div id="pagination" class="pagination" hidden><span id="page-summary" class="meta"></span><div class="page-actions"><button class="button subtle" id="prev">上一页</button><span id="page-label" class="meta"></span><button class="button subtle" id="next">下一页</button></div></div></section>
</section><div id="error" class="notice" role="alert" hidden></div></main>
<script src="runtime-config.js"></script>
<script>
const API_BASE=window.DEMO_API_BASE;
const $=id=>document.getElementById(id);
let session;try{session=JSON.parse(localStorage.getItem('demo-session-v2')||'null')}catch{session=null}
let page=1,total=0,busy=false,criteria={keyword:'',date:'',level:''};const pageSize=20;
function authView(){const admin=session?.role==='admin'&&session?.token;if(!admin){location.replace('index.html?role=admin&return=logs');return}$('workspace').hidden=false}
function showError(message){$('error').textContent=message;$('error').hidden=!message}
async function request(path,body,authenticated=true){const response=await fetch(API_BASE+path,{method:'PUT',headers:{'Content-Type':'application/json','X-Log-ID':crypto.randomUUID(),...(authenticated?{'Authorization':'Bearer '+session.token}:{})},body:JSON.stringify(body)});const data=await response.json().catch(()=>null);if(!response.ok||data?.code!==0){if(authenticated&&response.status===401){session=null;localStorage.removeItem('demo-session-v2');authView()}throw new Error(data?.message||'请求失败，请确认后端已启动。')}return data.data}
function cell(text,className=''){const td=document.createElement('td');td.textContent=text;if(className)td.className=className;return td}
function detail(panel,label,value,code=false){const key=document.createElement('div');key.className='detail-label';key.textContent=label;const val=document.createElement('div');val.className='detail-value'+(code?' code':'');val.textContent=value;panel.append(key,val)}
function render(result){total=result.total;$('count').textContent=`日志记录 · ${total} 条`;$('file').textContent=`${result.file} · 按文件顺序显示`;$('rows').replaceChildren();$('table').hidden=!result.items.length;$('empty').hidden=!!result.items.length;$('empty').textContent=total?'当前页没有记录，请返回上一页。':'没有匹配的日志，试试缩短关键词或切换级别、日期。';
for(const record of result.items){const row=document.createElement('tr');const timestamp=cell('','time');const parts=record.time.split('T');timestamp.textContent=parts[1]?.replace(/([+-]\d{4}|Z)$/,'')||record.time;const date=document.createElement('small');date.textContent=parts[0];timestamp.append(date);row.append(timestamp);const level=cell('');const badge=document.createElement('span');badge.className='badge '+record.level.toLowerCase().replace(/[^a-z]/g,'');badge.textContent=(record.level||'未知').toUpperCase();level.append(badge);row.append(level);const message=cell('','message');const summary=document.createElement('div');summary.className='preview';summary.textContent=record.message||'（无消息摘要）';const id=document.createElement('div');id.className='id';id.textContent=record.log_id||'未记录 Log ID';id.title=record.log_id;message.append(summary,id);row.append(message);const fields=new Map(record.fields.map(field=>[field.key,field]));row.append(cell(fields.has('sql')?'数据库 SQL':fields.has('path')?'HTTP 请求'+(fields.has('status')?' · '+fields.get('status').value:''):fields.has('topic')?'MQ 消息':'应用日志'));const latency=fields.get('latency')||fields.get('elapsed_ms');row.append(cell(latency?latency.value+' ms':'—'));const action=cell('');const toggle=document.createElement('button');toggle.className='detail-toggle';toggle.textContent='详情 ↓';toggle.setAttribute('aria-expanded','false');action.append(toggle);row.append(action);const expanded=document.createElement('tr');expanded.className='details';expanded.hidden=true;const content=cell('');content.colSpan=6;const panel=document.createElement('div');panel.className='detail-panel';detail(panel,'原始文件行号',String(record.line));detail(panel,'完整时间',record.time);detail(panel,'Log ID',record.log_id||'未记录');detail(panel,'完整消息',record.message);for(const field of record.fields)detail(panel,field.label,field.value,field.key==='sql'||field.key==='error');content.append(panel);expanded.append(content);toggle.onclick=()=>{expanded.hidden=!expanded.hidden;toggle.textContent=expanded.hidden?'详情 ↓':'收起 ↑';toggle.setAttribute('aria-expanded',String(!expanded.hidden))};$('rows').append(row,expanded)}
const pages=Math.max(1,Math.ceil(total/pageSize));$('pagination').hidden=!total;$('page-label').textContent=`${page} / ${pages}`;$('page-summary').textContent=`第 ${(page-1)*pageSize+1}–${Math.min(page*pageSize,total)} 条，每页 ${pageSize} 条`;$('prev').disabled=page<=1;$('next').disabled=page>=pages}
async function query(nextPage=1){if(busy)return;busy=true;page=nextPage;showError('');$('search').disabled=true;$('prev').disabled=true;$('next').disabled=true;$('search').textContent='查询中…';try{const result=await request('/api/logs/query',{...criteria,page,page_size:pageSize});render(result)}catch(error){$('table').hidden=true;$('pagination').hidden=true;$('count').textContent='日志记录';$('file').textContent='查询未完成';$('empty').hidden=false;$('empty').textContent='未获得查询结果。';showError(error.message==='Failed to fetch'?'无法连接后端，请确认 Go 服务已启动。':error.message)}finally{busy=false;$('search').disabled=false;$('search').textContent='查询日志'}}
$('query-form').onsubmit=event=>{event.preventDefault();if(busy)return;criteria={keyword:$('keyword').value.trim(),date:$('date').value,level:$('level').value};query(1)};
$('reset').onclick=()=>{if(busy)return;$('query-form').reset();criteria={keyword:'',date:'',level:''};query(1)};
$('prev').onclick=()=>query(page-1);$('next').onclick=()=>query(page+1);authView();
</script></body></html>
