<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gin QPS 监控</title>
<style>body{font:15px system-ui;margin:32px;color:#17202a;background:#f5f1ea}main{max-width:1000px;margin:auto;background:#fffdf8;padding:24px;border-radius:16px}h1{margin-top:0}.summary{display:flex;gap:28px;margin:18px 0}.stat b{display:block;font-size:28px}.muted{color:#6b7280}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e8e5df}.chart{height:170px;display:flex;align-items:end;gap:3px;border-bottom:1px solid #aaa;padding:10px 0}.bar{background:#d97745;flex:1;min-height:2px}</style>
<main><h1>Gin 请求监控</h1><p class="muted">每 5 秒刷新，统计最近 60 秒流量。</p><section class="summary"><div class="stat"><span class="muted">总请求</span><b id="requests">0</b></div><div class="stat"><span class="muted">当前 QPS</span><b id="qps">0</b></div><div class="stat"><span class="muted">错误数</span><b id="errors">0</b></div></section><div id="chart" class="chart" aria-label="接口请求量"></div><table><thead><tr><th>路由</th><th>请求数</th><th>QPS</th><th>错误</th><th>平均耗时</th></tr></thead><tbody id="rows"></tbody></table></main>
<script src="runtime-config.js"></script>
<script>async function refresh(){const logID=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;const r=await fetch(window.DEMO_API_BASE+'/api/metrics',{method:'PUT',headers:{'X-Log-ID':logID}});const body=await r.json();if(!r.ok||body.code!==0)throw new Error(body.message||"指标查询失败");const d=body.data;const routes=d.routes||[];const total=routes.reduce((n,x)=>n+x.requests,0),errors=routes.reduce((n,x)=>n+x.errors,0),currentQPS=routes.reduce((n,x)=>n+x.current_qps,0);document.querySelector('#requests').textContent=total;document.querySelector('#qps').textContent=currentQPS;document.querySelector('#errors').textContent=errors;document.querySelector('#rows').innerHTML=routes.map(x=>`<tr><td>${x.route}</td><td>${x.requests}</td><td>${x.current_qps}</td><td>${x.errors}</td><td>${x.avg_ms.toFixed(2)} ms</td></tr>`).join('');const max=Math.max(1,...routes.map(x=>x.requests));document.querySelector('#chart').innerHTML=routes.map(x=>`<div class="bar" style="height:${Math.max(2,x.requests/max*100)}%" title="${x.route}: ${x.requests}"></div>`).join('')}refresh();setInterval(refresh,5000)</script></html>
