<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品详情 · Go Shop</title>
  <style>
    :root{--ink:#17202a;--muted:#6b7280;--line:#e8e5df;--paper:#fffdf8;--accent:#d97745;--bg:#f5f1ea}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{height:70px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(20px,calc((100vw - 1080px)/2))}.brand{font-weight:800;text-decoration:none;color:var(--ink);letter-spacing:.04em}.brand span{color:var(--accent)}
    main{width:min(1080px,calc(100% - 32px));margin:44px auto}.back{color:var(--accent);text-decoration:none}.card{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:34px;margin-top:20px;padding:28px;background:var(--paper);border:1px solid var(--line);border-radius:18px}.visual{min-height:360px;background:#f1ede6;border-radius:14px;display:grid;place-items:center;overflow:hidden;color:var(--muted)}.visual img{width:100%;height:100%;min-height:360px;object-fit:contain}.details{align-self:center}.eyebrow{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.14em}.details h1{font-size:32px;line-height:1.25;margin:10px 0}.price{font-size:28px;font-weight:800;color:var(--accent);margin:18px 0}.meta{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--line)}.label,.muted{color:var(--muted)}.state{padding:50px;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;color:var(--muted)}
    @media(max-width:700px){main{margin:24px auto}.card{grid-template-columns:1fr;padding:16px;gap:22px}.visual,.visual img{min-height:250px}.details h1{font-size:26px}}
  </style>
</head>
<body>
  <header><a class="brand" href="index.html">go<span>shop</span></a></header>
  <main>
    <a class="back" href="index.html">← 返回商品列表</a>
    <div id="content" class="state" role="status">正在查询商品详情…</div>
  </main>
  <script src="runtime-config.js?v=20261016-3"></script>
  <script src="product_detail.js?v=20261016-3"></script>
</body>
</html>
