components:
    schemas:
        AuthResponse:
            properties:
                age:
                    type: integer
                create_time:
                    format: date-time
                    type: string
                email:
                    type: string
                id:
                    example: "368670969125933056"
                    type: string
                name:
                    type: string
                role:
                    enum:
                        - user
                        - admin
                    type: string
                token:
                    example: 请使用登录接口返回的64字符token
                    type: string
                update_time:
                    format: date-time
                    type: string
            type: object
        CreateOrder:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/OrderItemInput'
                    type: array
                order_no:
                    example: OD0123456789abcdef0123456
                    maxLength: 25
                    type: string
                user_id:
                    type: string
            required:
                - items
                - order_no
                - user_id
            type: object
        EmptyResp:
            description: 操作成功，无额外业务字段
            type: object
        Error:
            properties:
                code:
                    example: 40001
                    type: integer
                message:
                    example: 请求参数格式不正确
                    type: string
            type: object
        ImageResponse:
            properties:
                image:
                    type: string
            type: object
        LogEntry:
            properties:
                fields:
                    items:
                        $ref: '#/components/schemas/LogField'
                    type: array
                level:
                    type: string
                line:
                    type: integer
                log_id:
                    type: string
                message:
                    type: string
                time:
                    type: string
            type: object
        LogField:
            properties:
                key:
                    type: string
                label:
                    type: string
                value:
                    type: string
            type: object
        LogQuery:
            properties:
                date:
                    type: string
                keyword:
                    type: string
                level:
                    type: string
                page:
                    type: integer
                page_size:
                    type: integer
            type: object
        LogResult:
            properties:
                date:
                    type: string
                file:
                    type: string
                items:
                    items:
                        $ref: '#/components/schemas/LogEntry'
                    type: array
                keyword:
                    type: string
                level:
                    type: string
                page:
                    type: integer
                page_size:
                    type: integer
                total:
                    type: integer
            type: object
        MetricView:
            properties:
                avg_ms:
                    type: number
                errors:
                    type: integer
                requests:
                    type: integer
                route:
                    type: string
            type: object
        MetricsResponse:
            properties:
                routes:
                    items:
                        $ref: '#/components/schemas/MetricView'
                    type: array
            type: object
        Order:
            properties:
                amount:
                    type: integer
                create_time:
                    format: date-time
                    type: string
                expire_time:
                    description: 待支付订单的支付截止时间，创建后10分钟
                    format: date-time
                    type: string
                id:
                    type: string
                order_no:
                    type: string
                status:
                    enum:
                        - 1
                        - 2
                        - 3
                        - 4
                    type: integer
                update_time:
                    format: date-time
                    type: string
                user_id:
                    type: string
            type: object
        OrderItem:
            properties:
                id:
                    type: string
                image:
                    type: string
                order_id:
                    type: string
                product_id:
                    type: string
                product_version:
                    description: 下单时采用的商品资料版本；0表示历史数据未记录
                    type: integer
                product_name:
                    type: string
                quantity:
                    type: integer
                status:
                    enum:
                        - 1
                        - 2
                    type: integer
                unit_price_fen:
                    format: int64
                    type: integer
                update_time:
                    format: date-time
                    type: string
            type: object
        OrderItemInput:
            properties:
                image:
                    type: string
                name:
                    type: string
                product_id:
                    type: string
                product_version:
                    description: 商品列表返回的版本号；版本已变化时下单会被拒绝
                    minimum: 0
                    type: integer
                quantity:
                    minimum: 1
                    type: integer
                stock:
                    type: integer
                unit_price_fen:
                    minimum: 1
                    type: integer
            required:
                - product_id
                - quantity
                - unit_price_fen
            type: object
        OrderListItem:
            properties:
                amount:
                    description: 订单总金额，单位分
                    format: int64
                    type: integer
                create_time:
                    format: date-time
                    type: string
                expire_time:
                    description: 待支付订单的支付截止时间，创建后10分钟
                    format: date-time
                    type: string
                id:
                    type: string
                items:
                    items:
                        $ref: '#/components/schemas/OrderItem'
                    type: array
                order_no:
                    type: string
                status:
                    enum:
                        - 1
                        - 2
                        - 3
                        - 4
                    type: integer
                user_id:
                    type: string
            type: object
        OrderPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/OrderListItem'
                    type: array
                page:
                    type: integer
                page_size:
                    type: integer
                total:
                    description: ES命中总数；同步延迟期间实际返回数量可能较少
                    format: int64
                    type: integer
            type: object
        Product:
            properties:
                create_time:
                    format: date-time
                    type: string
                id:
                    type: string
                image:
                    type: string
                name:
                    type: string
                price:
                    example: 1234
                    type: integer
                stock:
                    type: integer
                update_time:
                    format: date-time
                    type: string
                version:
                    description: 当前商品资料版本号
                    type: integer
            type: object
        ProductPage:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Product'
                    type: array
                page:
                    type: integer
                page_size:
                    type: integer
                total:
                    type: integer
            type: object
        ProductUpdate:
            properties:
                image:
                    nullable: true
                    type: string
                name:
                    nullable: true
                    type: string
                price:
                    maximum: 1e+08
                    minimum: 1
                    nullable: true
                    type: integer
                stock:
                    maximum: 1e+06
                    minimum: 0
                    nullable: true
                    type: integer
            type: object
        Response:
            properties:
                code:
                    type: integer
                data: {}
                message:
                    type: string
            type: object
        createUserRequest:
            properties:
                age:
                    type: integer
                email:
                    type: string
                name:
                    type: string
                password:
                    type: string
            type: object
        loginRequest:
            properties:
                email:
                    type: string
                password:
                    type: string
            type: object
        productRequest:
            properties:
                image:
                    type: string
                name:
                    type: string
                price:
                    type: integer
                stock:
                    type: integer
            type: object
    securitySchemes:
        BearerAuth:
            description: 登录接口返回的token，有效期24小时
            scheme: bearer
            type: http
info:
    contact: {}
    description: |-
        业务接口使用 PUT；ID 使用字符串，金额单位为分。登录后将 Bearer token 填入 Authorization。部分更新的缺省/null 字段不修改，显式零值参与更新。错误返回 code/message；成功响应按各接口定义返回，不统一包裹。
        JSON 接口统一返回 {code,message,data}，成功 code=0，data 由业务响应协议定义。ID 为十进制字符串；金额为整数分；时间为 RFC3339。HTTP 请求/响应定义位于 http_handler/http_msg。导出 Excel 和 Prometheus 文本除外。
    title: Go Framework Demo API
    version: "1.0"
openapi: 3.0.3
paths:
    /api/admin/orders/list:
        put:
            parameters:
                - description: 可选用户ID，不传则查询所有用户
                  in: query
                  name: user_id
                  required: false
                  schema:
                    type: string
                - description: 1待支付、2已支付、3已完成、4已取消；不传则查询全部状态
                  in: query
                  name: status
                  schema:
                    enum:
                        - 1
                        - 2
                        - 3
                    type: integer
                - in: query
                  name: sort
                  schema:
                    default: updated_desc
                    enum:
                        - updated_desc
                        - updated_asc
                        - price_asc
                        - price_desc
                    type: string
                - description: 最低订单总金额（整数分），包含端点
                  in: query
                  name: price_min
                  schema:
                    format: int64
                    minimum: 0
                    type: integer
                - description: 最高订单总金额（整数分），包含端点
                  in: query
                  name: price_max
                  schema:
                    format: int64
                    minimum: 0
                    type: integer
                - description: 创建时间下限，带时区；ES 使用毫秒时间戳过滤
                  in: query
                  name: created_from
                  schema:
                    format: date-time
                    type: string
                - description: 创建时间上限，包含端点
                  in: query
                  name: created_to
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: page
                  schema:
                    default: 1
                    minimum: 1
                    type: integer
                - in: query
                  name: page_size
                  schema:
                    default: 20
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        enum:
                                            - 0
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/OrderPage'
                                    message:
                                        example: success
                                        type: string
                                required:
                                    - code
                                    - message
                                    - data
                                type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 参数错误（40001）
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 未登录或会话失效（40101）
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 需要管理员权限
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 内部错误（50001），不暴露底层原因
            security:
                - BearerAuth: []
            summary: 管理员分页查询全部用户订单（ES筛选ID，MySQL回查）
            tags:
                - 订单
    /api/auth/login:
        put:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/loginRequest'
                description: 邮箱与密码
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        enum:
                                            - 0
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/AuthResponse'
                                    message:
                                        example: success
                                        type: string
                                required:
                                    - code
                                    - message
                                    - data
                                type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 参数错误（40001）
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 未登录或会话失效（40101）
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 内部错误（50001），不暴露底层原因
            summary: 登录
            tags:
                - 认证
    /api/auth/logout:
        put:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        enum:
                                            - 0
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/EmptyResp'
                                    message:
                                        example: success
                                        type: string
                                required:
                                    - code
                                    - message
                                    - data
                                type: object
                    description: 注销成功
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 参数错误（40001）
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 未登录或会话失效（40101）
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 内部错误（50001），不暴露底层原因
            security:
                - BearerAuth: []
            summary: 退出登录
            tags:
                - 认证
    /api/auth/session:
        put:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        enum:
                                            - 0
                                        type: integer
                                    data:
                                        type: object
                                        required: [id, name, role]
                                        properties:
                                            id:
                                                type: string
                                            name:
                                                type: string
                                            role:
                                                type: string
                                                enum: [user, admin]
                                    message:
                                        example: success
                                        type: string
                                required:
                                    - code
                                    - message
                                    - data
                                type: object
                    description: 会话有效
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 参数错误（40001）
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 未登录或会话失效（40101）
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 内部错误（50001），不暴露底层原因
            security:
                - BearerAuth: []
            summary: 校验当前登录会话
            tags:
                - 认证
    /api/auth/register:
        put:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/createUserRequest'
                description: 姓名、年龄、邮箱和6–18位密码
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        enum:
                                            - 0
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/AuthResponse'
                                    message:
                                        example: success
                                        type: string
                                required:
                                    - code
                                    - message
                                    - data
                                type: object
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 参数错误（40001）
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 邮箱或用户信息已存在
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 内部错误（50001），不暴露底层原因
            summary: 注册并登录
            tags:
                - 认证
    /api/logs/query:
        put:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LogQuery'
                description: 关键词、日期、级别和分页条件
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Response'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/LogResult'
                                      type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 参数错误（40001）
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 未登录或会话失效（40101）
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 需要管理员权限（40301）
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 日志文件不存在
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 内部错误（50001），不暴露底层原因
            security:
                - BearerAuth: []
            summary: 查询应用日志
            tags:
                - 运维
    /api/metrics:
        put:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        enum:
                                            - 0
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/MetricsResponse'
                                    message:
                                        example: success
                                        type: string
                                required:
                                    - code
                                    - message
                                    - data
                                type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 参数错误（40001）
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 内部错误（50001），不暴露底层原因
            summary: 查询接口指标摘要
            tags:
                - 运维
    /api/orders:
        put:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateOrder'
                description: 订单号最多25字符，user_id必须为当前用户。同一用户重试须复用 order_no 且提交相同商品内容；提交的商品版本必须仍是当前版本。重复请求返回原订单，不同内容返回409。
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        enum:
                                            - 0
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/Order'
                                    message:
                                        example: success
                                        type: string
                                required:
                                    - code
                                    - message
                                    - data
                                type: object
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 参数错误（40001）
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 未登录或会话失效（40101）
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 禁止替其他用户下单
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 商品变化、库存不足或订单号冲突
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 内部错误（50001），不暴露底层原因
            security:
                - BearerAuth: []
            summary: 创建订单
            tags:
                - 订单
    /api/orders/{id}/items/{item_id}/ship:
        put:
            description: 仅已支付订单可以发货，不改变父订单状态
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - in: path
                  name: item_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        enum:
                                            - 0
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/OrderItem'
                                    message:
                                        example: success
                                        type: string
                                required:
                                    - code
                                    - message
                                    - data
                                type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 参数无效
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 未登录
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 权限不足
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 订单或明细不存在，或不属于当前用户/订单
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 订单状态不允许此操作
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 内部错误
            security:
                - BearerAuth: []
            summary: 管理员标记单条订单明细发货
            tags:
                - 订单
    /api/orders/{id}/pay:
        put:
            description: 截止时间前将待支付订单改为已支付；超时或已取消订单不能支付，重复支付已支付订单幂等
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    code:
                                        enum:
                                            - 0
                                        type: integer
                                    data:
                                        $ref: '#/components/schemas/Order'
                                    message:
                                        example: success
                                        type: string
                                required:
                                    - code
                                    - message
                                    - data
                                type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 参数无效
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 未登录
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 权限不足
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 订单或明细不存在，或不属于当前用户/订单
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 订单状态不允许此操作
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: 内部错误
            security:
                - BearerAuth: []
            summary: 模拟支付当前用户的待支付订单
