                - description: 最高价格（分）
                  in: query
                  name: price_max
                  schema:
                    type: integer
                - description: 最小库存
                  in: query
                  name: stock_min
                  schema:
                    type: integer
                - description: 最大库存
                  in: query
                  name: stock_max
