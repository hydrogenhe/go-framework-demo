                - description: 当前用户ID；管理员可查询其他用户
                  in: query
                  name: user_id
                  required: true
                  schema:
                    type: string
                - description: 1待支付、2已支付、3已完成、4已取消；不传则查询全部状态
                  in: query
                  name: status
                  schema:
                    enum:
                        - 1
                        - 2
                        - 3
                    type: integer
                - in: query
                  name: sort
                  schema:
                    default: updated_desc
                    enum:
                        - updated_desc
                        - updated_asc
                        - price_asc
                        - price_desc
                    type: string
                - description: 最低订单总金额（整数分），包含端点
                  in: query
                  name: price_min
                  schema:
                    format: int64
                    minimum: 0
                    type: integer
                - description: 最高订单总金额（整数分），包含端点
                  in: query
                  name: price_max
                  schema:
                    format: int64
                    minimum: 0
                    type: integer
                - description: 创建时间下限，带时区；ES 使用毫秒时间戳过滤
                  in: query
                  name: created_from
                  schema:
                    format: date-time
                    type: string
                - description: 创建时间上限，包含端点
                  in: query
                  name: created_to
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: page
                  schema:
                    default: 1
                    minimum: 1
                    type: integer
                - in: query
                  name: page_size
                  schema:
                    default: 20
                    maximum: 100
                    minimum: 1
