name: demo-product-images
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: demo-seaweedfs
    command: ["mini", "-dir=/data", "-ip=127.0.0.1", "-ip.bind=0.0.0.0"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:23646:23646"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Run components_sh/restart_image.sh to load conf/image_storage.yaml}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Run components_sh/restart_image.sh to load conf/image_storage.yaml}
      S3_BUCKET: ${S3_BUCKET:?Run components_sh/restart_image.sh to load conf/image_storage.yaml}
    volumes:
      - ./data:/data
